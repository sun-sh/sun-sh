name: Update star badges

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update generated star badges
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          update_badge() {
            local repo="$1"
            local output="$2"
            local count value

            count="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repo}" | jq -r '.stargazers_count')"
            value="$(awk -v count="${count}" 'BEGIN { printf "%.1f", count / 1000 }')k"

            cat > "${output}" <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="84" height="20" role="img" aria-label="Stars: ${value}"><title>Stars: ${value}</title><g shape-rendering="crispEdges"><rect width="39" height="20" fill="#555"/><rect x="39" width="45" height="20" fill="#181717"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text x="205" y="140" textLength="290" transform="scale(.1)">Stars</text><text x="615" y="140" textLength="350" transform="scale(.1)">${value}</text></g></svg>
          EOF
          }

          update_badge "bytedance/deer-flow" "assets/stars/deer-flow.svg"
          update_badge "Tencent/WeKnora" "assets/stars/weknora.svg"

          if git diff --quiet -- assets/stars; then
            echo "Star badges are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stars
          git commit -m "chore: update star badges"
          git push